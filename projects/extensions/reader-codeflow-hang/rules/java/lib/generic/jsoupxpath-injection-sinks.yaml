rules:
  - id: jsoupxpath-xpath-injection-sinks
    options:
      lib: true
    severity: NOTE
    message: XPath expression evaluated by JsoupXpath contains user-manipulated data
    languages:
      - java
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (org.seimicrawler.xpath.JXDocument $DOC).selN($UNTRUSTED)
              - pattern: (org.seimicrawler.xpath.JXNode $NODE).sel($UNTRUSTED)
          - focus-metavariable: $UNTRUSTED
