  - function: redis.clients.jedis.Jedis#zadd
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#zrange
    copy:
      - from: this
        to: result
  - function: redis.clients.jedis.Jedis#zrangeByScore
    copy:
      - from: this
        to: result
  - function: redis.clients.jedis.Jedis#zrem
    copy:
      - from: arg(*)
