rules:
  - id: vertx-cors-reflection-sink
    options:
      lib: true
    severity: NOTE
    message: Untrusted value reflected into the Access-Control-Allow-Origin response header
    metadata:
      short-description: Reflected Origin into Access-Control-Allow-Origin (CORS misconfiguration)
    languages:
      - java
    mode: taint
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (io.vertx.core.http.HttpServerResponse $RES).putHeader("Access-Control-Allow-Origin", $UNTRUSTED)
              - pattern: (io.vertx.core.http.HttpServerResponse $RES).putHeader("Access-Control-Allow-Origin", (CharSequence $UNTRUSTED))
          - focus-metavariable: $UNTRUSTED
