rules:
  - id: gson-from-json-string-type-source
    options:
      lib: true
    severity: NOTE
    message: Gson fromJson returns data parsed from JSON
    metadata:
      short-description: Gson fromJson JSON binding source
    languages:
      - java
    patterns:
      - pattern: |
          $UNTRUSTED = (com.google.gson.Gson $GSON).fromJson($JSON, $TYPE);
