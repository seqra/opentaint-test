rules:
  - id: gson-untrusted-data-source
    options:
      lib: true
    severity: NOTE
    message: Untrusted data flows from here
    metadata:
      short-description: Untrusted data source from Gson JSON deserialization
      full-description: |-
        This is a source rule for untrusted input deserialized by Google Gson.
        It marks the object returned by `Gson.fromJson(String, Type)` as tainted,
        because the parsed JSON typically originates from attacker-controlled input
        (request bodies, stored book-source rules, header maps) and the resulting
        object carries that attacker-controlled data.
    languages:
      - java
    patterns:
      - pattern: |
          $UNTRUSTED = (com.google.gson.Gson $G).fromJson($JSON, $TYPE);
