rules:
  - id: javax-script-script-engine-eval-bindings-sink
    options:
      lib: true
    severity: NOTE
    message: Risky ScriptEngine eval of untrusted script with bindings
    metadata:
      short-description: ScriptEngine eval script sink
    languages:
      - java
    pattern-either:
      - pattern: (javax.script.ScriptEngine $SE).eval($UNTRUSTED, $B)
