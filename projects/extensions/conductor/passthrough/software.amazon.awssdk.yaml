# Pass-through approximations for AWS SDK v2 request builders / RequestBody factories.
#
# Models the dropped (not-yet-approximated) software.amazon.awssdk methods listed
# in the tracking unit software_amazon_awssdk-passthrough.yaml.
#
# RequestBody.fromString / fromInputStream are static factories: the tainted
# argument (the body content / stream) flows into the produced RequestBody.
# All other targets are fluent builder setters: the tainted argument flows onto
# the builder (this, for chaining) and onto the returned builder (result).
#
# OVERRIDE mode: merged with built-ins at the rule level (per-method, additive).
passThrough:
  # RequestBody.fromString(String) -> RequestBody carrying the tainted body
  - function: software.amazon.awssdk.core.sync.RequestBody#fromString
    copy:
      - from: arg(0)
        to: result

  # RequestBody.fromInputStream(InputStream, long) -> RequestBody carrying the tainted stream
  - function: software.amazon.awssdk.core.sync.RequestBody#fromInputStream
    copy:
      - from: arg(0)
        to: result

