# OpenTaint passThrough approximations — redis.clients.jedis
#
# Models the dropped Jedis read/write operations from the tracking unit
# redis_clients_jedis-passthrough.yaml.
#
# Semantics (per signatures in jedis-6.0.0 / 3.6.0):
#   Writes  (set/hset/sadd/rpush/zadd): tainted key/value args flow INTO the
#           store (the receiver). Modeled arg(*) -> this. These ops return a
#           status String ("OK") or a long count, never the written value, so
#           no copy to result.
#   Reads   (get/hget/lrange/zrange/zrangeByScore): return the tainted value
#           held by the store. Modeled this -> result.
#   Scans   (hscan/sscan): return a ScanResult backed by the store. this ->
#           result, and the ScanResult ctor carries its result-list arg out.
#   Mutators(del/expire/hdel/ltrim/srem/zrem/zremrangeByScore): tainted key/
#           member args flow into the op against the receiver. arg(*) -> this.
#
# Function matchers are name-based (cover all overloads). copy: arg(*) covers
# the value arg regardless of its position across overloads.
#
# OVERRIDE mode, additive per method: a rule that collides with a built-in
# simply overrides it; it does not error at load.
passThrough:
  # ---------------- Jedis ----------------
  - function: redis.clients.jedis.Jedis#del
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#expire
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#hdel
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#hget
    copy:
      - from: this
        to: result
  - function: redis.clients.jedis.Jedis#hscan
    copy:
      - from: this
        to: result
  - function: redis.clients.jedis.Jedis#hset
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#lrange
    copy:
      - from: this
        to: result
  - function: redis.clients.jedis.Jedis#ltrim
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#rpush
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#sadd
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#set
    copy:
      - from: arg(*)
        to: this
  - function: redis.clients.jedis.Jedis#srem
    copy:
      - from: arg(*)
