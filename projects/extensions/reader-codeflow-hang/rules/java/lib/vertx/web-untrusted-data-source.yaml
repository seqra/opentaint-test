rules:
  - id: vertx-web-untrusted-data-source
    options:
      lib: true
    severity: NOTE
    message: Untrusted data flows from a Vert.x web request
    metadata:
      short-description: Untrusted data source in Vert.x web (io.vertx.ext.web)
      full-description: |-
        This is a source rule for attacker-controlled HTTP request data in
        Vert.x web (io.vertx.ext.web) routing handlers.

        Source locations matched by this rule:
        - `RoutingContext.queryParam(name)` returns query-string parameter values.
        - `RoutingContext.getBodyAsString()` / `getBodyAsJson()` / `getBodyAsJsonArray()`
          return the raw request body.
        - `RoutingContext.fileUploads()` returns the multipart upload metadata set.
        - `FileUpload.uploadedFileName()` returns the attacker-supplied upload filename.
    languages:
      - java
    patterns:
      - pattern-either:
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.RoutingContext $CTX).queryParam(...);
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.RoutingContext $CTX).getBodyAsString(...);
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.RoutingContext $CTX).getBodyAsJson(...);
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.RoutingContext $CTX).getBodyAsJsonArray(...);
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.RoutingContext $CTX).fileUploads(...);
          - pattern: |
              $UNTRUSTED = (io.vertx.ext.web.FileUpload $UPLOAD).uploadedFileName(...);
