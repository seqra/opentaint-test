rules:
  - id: path-traversal-java-path-traversal-sinks-lib-ext
    severity: ERROR
    message: Untrusted data reaches the built-in path-traversal sink
    metadata:
      cwe: CWE-22
      short-description: Path traversal via created untrusted sources into the built-in java.io.File sink
    languages: [java]
    mode: join
    join:
      refs:
        - rule: java/lib/vertx/untrusted-data-source.yaml#vertx-core-untrusted-data-source
          as: vertx-core-source
        - rule: java/lib/vertx/untrusted-data-source.yaml#vertx-web-client-untrusted-data-source
          as: vertx-web-client-source
        - rule: java/lib/vertx/web-untrusted-data-source.yaml#vertx-web-untrusted-data-source
          as: vertx-web-source
        - rule: java/lib/okhttp/response-body-untrusted-source.yaml#okhttp3-response-body-untrusted-source
          as: okhttp-source
        - rule: java/lib/generic/retrofit2-response-untrusted-source.yaml#retrofit2-response-body-untrusted-source
          as: retrofit2-source
        - rule: java/lib/generic/gson-untrusted-data-source.yaml#gson-untrusted-data-source
          as: gson-source
        - rule: java/lib/generic/jsonpath-untrusted-data-source.yaml#jsonpath-untrusted-data-source
          as: jsonpath-source
        - rule: java/lib/generic/path-traversal-sinks.yaml#java-path-traversal-sinks
          as: sink
      on:
        - 'vertx-core-source.$UNTRUSTED -> sink.$FILE'
        - 'vertx-web-client-source.$UNTRUSTED -> sink.$FILE'
        - 'vertx-web-source.$UNTRUSTED -> sink.$FILE'
        - 'okhttp-source.$UNTRUSTED -> sink.$FILE'
        - 'retrofit2-source.$UNTRUSTED -> sink.$FILE'
        - 'gson-source.$UNTRUSTED -> sink.$FILE'
        - 'jsonpath-source.$UNTRUSTED -> sink.$FILE'
