rules:
  - id: repro-reflect-source
    options:
      lib: true
    severity: NOTE
    message: Untrusted data flows from repro.Repro.source()
    metadata:
      short-description: Repro taint source repro.Repro.source()
      full-description: |-
        Source rule for the reproduction kit. The return value of
        repro.Repro.source():String is treated as untrusted. Modeled on the
        project's *-untrusted-data-source lib rules ($UNTRUSTED = <source call>).
    languages:
      - java
    patterns:
      - pattern: |
          $UNTRUSTED = repro.Repro.source();
