rules:
  - id: xpath-injection-jsoupxpath-xpath-injection-sinks-lib-ext
    severity: ERROR
    message: Untrusted data reaches a JsoupXpath XPath-injection sink
    metadata:
      cwe: CWE-643
      short-description: XPath injection via untrusted input into JsoupXpath selN/sel
    languages: [java]
    mode: join
    join:
      refs:
        - rule: java/lib/generic/servlet-untrusted-data-source.yaml#java-servlet-untrusted-data-source
          as: servlet-source
        - rule: java/lib/spring/untrusted-data-source.yaml#spring-untrusted-data-source
          as: spring-source
        - rule: java/lib/vertx/untrusted-data-source.yaml#vertx-core-untrusted-data-source
          as: vertx-core-source
        - rule: java/lib/vertx/untrusted-data-source.yaml#vertx-web-client-untrusted-data-source
          as: vertx-web-client-source
        - rule: java/lib/vertx/web-untrusted-data-source.yaml#vertx-web-untrusted-data-source
          as: vertx-web-source
        - rule: java/lib/okhttp/response-body-untrusted-source.yaml#okhttp3-response-body-untrusted-source
          as: okhttp-source
        - rule: java/lib/generic/retrofit2-response-untrusted-source.yaml#retrofit2-response-body-untrusted-source
          as: retrofit2-source
        - rule: java/lib/generic/gson-untrusted-data-source.yaml#gson-untrusted-data-source
          as: gson-source
        - rule: java/lib/generic/jsonpath-untrusted-data-source.yaml#jsonpath-untrusted-data-source
          as: jsonpath-source
        - rule: java/lib/generic/jsoupxpath-injection-sinks.yaml#jsoupxpath-xpath-injection-sinks
          as: sink
      on:
        - 'servlet-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'spring-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'vertx-core-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'vertx-web-client-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'vertx-web-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'okhttp-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'retrofit2-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'gson-source.$UNTRUSTED -> sink.$UNTRUSTED'
        - 'jsonpath-source.$UNTRUSTED -> sink.$UNTRUSTED'
