plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Only dependency: supplies the @RestController / @GetMapping / @RequestParam
    // annotations that lib/spring/untrusted-data-source.yaml matches on.
    implementation 'org.springframework:spring-web:7.0.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
